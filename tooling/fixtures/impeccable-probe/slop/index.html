<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Launch</title>
<style>

<section class="hero"><h1>Supercharge your workflow</h1><p>The all-in-one platform for modern teams.</p><button class="btn">Get started</button></section>
<main><div class="card"><h2>Features</h2><div class="card"><h2>Fast</h2><p>Blazing fast.</p></div><div class="card"><h2>Secure</h2><p>Enterprise grade.</p></div></div></main>
