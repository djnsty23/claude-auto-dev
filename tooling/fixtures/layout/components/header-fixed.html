<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>header fixed</title>
<!--
  header-mess.html rebuilt from one control size: every control 44px tall,
  centred, 1px border, 8px corners, 12px label inset; the counter and the
  upgrade button 8px apart; the avatar one circle with one border; the stripe
  spanning the header; 16px side gutters.
-->
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
  header{position:relative;background:#fff;border-bottom:1px solid #e5e5e5}
  .stripe{height:4px;background:linear-gradient(90deg,#7c3aed,#db2777)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
  .menu{width:44px;height:44px;border:1px solid #d4d4d4;border-radius:8px;background:#fff;display:grid;place-items:center;padding:0}
  .menu span{display:block;width:16px;height:2px;background:#333;box-shadow:0 5px 0 #333,0 -5px 0 #333}
  .brand{font-weight:700;color:#111;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
  .right{display:flex;align-items:center;gap:8px}
  .counter{margin:0;height:44px;display:flex;align-items:center;padding:0 12px;border:1px solid #d4d4d4;border-radius:8px;font-size:14px;color:#555}
  .pro{height:44px;display:flex;align-items:center;padding:0 12px;background:#7c3aed;color:#fff;border:1px solid #7c3aed;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
  .avatar{width:44px;height:44px;border:1px solid #d4d4d4;border-radius:999px;display:grid;place-items:center;background:#f3f3f3;font-size:13px}
  main{max-width:960px;margin:0 auto;padding:24px 16px}
</style>
</head><body>
<header>
  <div class="stripe"></div>
  <div class="row">
    <button class="menu" aria-label="Menu"><span></span></button>
    <a class="brand" href="#">Brand</a>
    <div class="right">
      <p class="counter">0/3</p>
      <a class="pro" href="#">Pro</a>
      <span class="avatar">A</span>
    </div>
  </div>
</header>
<main>
  <h1>Your codes</h1>
  <p>Nothing here yet. Create your first one to see it listed.</p>
</main>
</body></html>
