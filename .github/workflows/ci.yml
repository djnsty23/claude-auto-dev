name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped 2026-08-17, RE-ADDED 2026-09-07 on the condition the
        # 2026-08-17 comment set for itself: "the day a macOS-only failure
        # appears." That day was 2026-09-07.
        #
        # The claim that justified dropping it was "no darwin-specific code
        # paths", and it was false. node's process.stdout is ASYNCHRONOUS when
        # it is a pipe on darwin, and SYNCHRONOUS when it is a pipe on linux and
        # win32. A process.exit() does not drain a pending async write, so
        # rendered-layout-gate.js --json delivered 65536 bytes — one OS pipe
        # buffer — of invalid JSON out of 84752, under exit status 0. Its suite
        # had been failing 2 of 282 on every mac in the project since the day it
        # was written, and green here throughout.
        #
        # That is the shape of platform risk worth paying for: not a crash, which
        # any platform shows you, but a divergence that returns a SUCCESS status
        # over a wrong answer. "Pure Node with no native deps" does not imply
        # identical behaviour — the stdio semantics of the runtime itself differ.
        #
        # The cost, re-measured rather than re-quoted. The 2026-08-17 note said
        # macOS "tripled CI wall-clock per push"; matrix legs run CONCURRENTLY,
        # so what tripled was runner MINUTES, and wall-clock moves only by macOS
        # queue time. This repo is public, so minutes bill $0 gross. The macOS
        # leg is also the short one: every step below except `npm test` and the
        # hook parse is gated to ubuntu-latest, so it does not run check:suites
        # or the four advisory gates. Queue contention on a $0 line is the whole
        # bill, against a defect class that reports success while lying.
        #
        # If that queue time ever does hurt, cut it by EVENT rather than by
        # platform — the recorded cost driver was 28 pushes in one day, not the
        # PRs. windows-latest stays for its own reasons: cmd.exe routing, the
        # PowerShell curl alias, CRLF, reserved device names.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v7 is the current major for both and runs natively.
      # This job touches neither action's optional surface — checkout takes no
      # inputs, setup-node takes only node-version (no cache, no registry) — so
      # nothing in the v5/v6/v7 changelogs applies here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (autodev-memory) is built in from Node 22.
          node-version: '22'
      # validate.js asks `claude plugin validate` to scan autodev-core's hooks
      # module, and when no `claude` is on PATH it WARNs instead of passing.
      # Until 2026-09-08 none was on PATH here, and the operator's machine
      # carried 2.1.233, which prints no scan at all — so the module was
      # verified NOWHERE while every environment reported green or yellow.
      #
      # PINNED, not `latest`: the scan's event vocabulary moved between 2.1.258
      # and 2.1.259 (the measured table is beside HOOKS_MODULE_HOST_FLOOR in
      # tooling/validate.js), and a floating install would turn the next such
      # move into a red on main with no commit to bisect. Bump the pin on
      # purpose, with validate re-run against the new version in the commit
      # message. Install measured at 3 s. All three legs, because the mac and
      # windows legs are the ones that exercise the shell spawn and the .cmd
      # shim the check's own comments document; a scan that runs only on Linux
      # would say nothing about either.
      - name: Install a Claude Code that scans hooks modules
        run: npm install -g @anthropic-ai/claude-code@2.1.263
      - name: Run test suites and validator
        run: npm test
      - name: Check every hook parses
        shell: bash
        run: |
          for f in plugins/*/hooks/*.js; do node --check "$f"; done

      # A green suite that executes nothing is this repo's worst historical bug:
      # test-all.js once spawned a bare `node` for every suite and CI passed on
      # an empty run. This stubs each suite's subject and asserts the suite goes
      # red. It rewrites files in place and restores them, so it runs only on
      # Linux — one clean checkout is enough, and three would just triple a
      # 40-second job for the same answer.
      - name: Prove every suite can fail
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:suites

      # A gate as of this commit: the count is 0 and mutation-verified. It
      # fails on a script that announces an absence without printing a
      # population or carrying a runtime control. It runs here so a regression
      # is caught on the PR that introduces it; a detector nobody runs reports
      # nothing and looks identical to a clean one.
      - name: Population and control reporting (advisory)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:population

      # Probes every script entry point with --help under a 10s budget, in a
      # scratch copy of the tree so a script that ignores the flag and mutates
      # cannot touch the source. It grades HANGS only: a non-zero exit is
      # reported, never failed on, because plenty of scripts answer --help with
      # exit 1 or 2. Wired here on 2026-09-02 after an audit round found the
      # script defined, its suite running, and the gate itself invoked by
      # nothing, which is a detector that reports the same as a clean one.
      - name: Entry points return under budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:entrypoints

      # A skill body that MANDATES a tool it does not declare in allowed-tools
      # fails at run time in someone else's session, where nothing here can see
      # it. Mutation-verified before wiring: a planted skill mandating an
      # undeclared tool takes this to exit 1. Its two siblings are deliberately
      # NOT wired: check:triggers grades prose heuristically and says so in its
      # own header, and check:skills runs only a selftest.
      - name: Skill bodies declare the tools they mandate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:skill-tools
