name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS was dropped 2026-08-17 on the standing condition "re-add
        # macos-latest the day a macOS-only failure appears". RE-ADDED
        # 2026-09-07: that day came, and the reason it was dropped was wrong.
        #
        # The dropped-comment's load-bearing claim was "no darwin-specific code
        # paths". That was false, and it was false in the way source review
        # cannot catch: the darwin-specific path is not in this repo's code, it
        # is in the RUNTIME UNDERNEATH IT. Node's stdout is asynchronous for
        # PIPES on macOS and synchronous for pipes on Linux and Windows. So a
        # script that writes more than the 64KiB pipe buffer and then calls
        # process.exit() delivers TRUNCATED output with exit status 0 on macOS
        # and correct output everywhere else. Being pure Node with no native
        # deps does not buy immunity from this; being pure Node is what exposes
        # you to it.
        #
        # That is not hypothetical here. rendered-layout-gate.js --json emitted
        # 84752 bytes to a file and 65536 to a pipe, status 0 both ways, and
        # test-rendered-layout-gate.js was red on every Mac while CI on the same
        # commit was green. It reached trunk (25d91dd) and blocked every macOS
        # session in the fleet, because the only platform that could see it was
        # the one platform not in this matrix. A green check measuring a
        # platform the failure cannot occur on is worse than no check: it is a
        # check that actively certifies the broken commit.
        #
        # Cost, stated honestly: this repo is PUBLIC, so runner minutes bill
        # $0 — do not re-litigate this on price. Matrix legs run in parallel, so
        # the cost is runner minutes and queueing, not wall-clock per push. The
        # macOS leg also runs only the two ungated steps below; every heavier
        # check stays pinned to ubuntu-latest, so this adds the cheap half.
        #
        # Before dropping it again, name the mechanism that makes macOS
        # unable to differ — "it is pure Node" is the claim that already failed.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v7 is the current major for both and runs natively.
      # This job touches neither action's optional surface — checkout takes no
      # inputs, setup-node takes only node-version (no cache, no registry) — so
      # nothing in the v5/v6/v7 changelogs applies here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (autodev-memory) is built in from Node 22.
          node-version: '22'
      - name: Run test suites and validator
        run: npm test
      - name: Check every hook parses
        shell: bash
        run: |
          for f in plugins/*/hooks/*.js; do node --check "$f"; done

      # A green suite that executes nothing is this repo's worst historical bug:
      # test-all.js once spawned a bare `node` for every suite and CI passed on
      # an empty run. This stubs each suite's subject and asserts the suite goes
      # red. It rewrites files in place and restores them, so it runs only on
      # Linux — one clean checkout is enough, and three would just triple a
      # 40-second job for the same answer.
      - name: Prove every suite can fail
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:suites

      # A gate as of this commit: the count is 0 and mutation-verified. It
      # fails on a script that announces an absence without printing a
      # population or carrying a runtime control. It runs here so a regression
      # is caught on the PR that introduces it; a detector nobody runs reports
      # nothing and looks identical to a clean one.
      #
      # The name said "(advisory)" until 2026-09-08 and that was false: there is
      # no continue-on-error here, and check-population-reporting.js ends on
      # `process.exit(failed ? 1 : 0)`, so a finding fails the job like any other
      # step. Two readings were available and only one is right — the LABEL was
      # stale, not the behaviour. Adding continue-on-error to make the word true
      # would have weakened a mutation-verified gate to fix a caption. The
      # comment directly above already called it a gate; the name now agrees.
      - name: Population and control reporting (gate)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:population

      # Probes every script entry point with --help under a 10s budget, in a
      # scratch copy of the tree so a script that ignores the flag and mutates
      # cannot touch the source. It grades HANGS only: a non-zero exit is
      # reported, never failed on, because plenty of scripts answer --help with
      # exit 1 or 2. Wired here on 2026-09-02 after an audit round found the
      # script defined, its suite running, and the gate itself invoked by
      # nothing, which is a detector that reports the same as a clean one.
      - name: Entry points return under budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:entrypoints

      # A skill body that MANDATES a tool it does not declare in allowed-tools
      # fails at run time in someone else's session, where nothing here can see
      # it. Mutation-verified before wiring: a planted skill mandating an
      # undeclared tool takes this to exit 1. Its two siblings are deliberately
      # NOT wired: check:triggers grades prose heuristically and says so in its
      # own header, and check:skills runs only a selftest.
      - name: Skill bodies declare the tools they mandate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:skill-tools
