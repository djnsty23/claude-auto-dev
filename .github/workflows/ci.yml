name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-11-01: repo made private, so runner minutes now bill (macOS 10x,
        # Windows 2x). Owner decision: ubuntu-only, PRs plus pushes to main,
        # superseded runs cancelled. Re-add a platform only with the owner's OK.
        os: [ubuntu-latest]
    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v7 is the current major for both and runs natively.
      # This job touches neither action's optional surface — checkout takes no
      # inputs, setup-node takes only node-version (no cache, no registry) — so
      # nothing in the v5/v6/v7 changelogs applies here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (autodev-memory) is built in from Node 22.
          node-version: '22'
      - name: Run test suites and validator
        run: npm test
      - name: Check every hook parses
        shell: bash
        run: |
          for f in plugins/*/hooks/*.js; do node --check "$f"; done

      # A green suite that executes nothing is this repo's worst historical bug:
      # test-all.js once spawned a bare `node` for every suite and CI passed on
      # an empty run. This stubs each suite's subject and asserts the suite goes
      # red. It rewrites files in place and restores them, so it runs only on
      # Linux — one clean checkout is enough, and three would just triple a
      # 40-second job for the same answer.
      - name: Prove every suite can fail
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:suites

      # A gate as of this commit: the count is 0 and mutation-verified. It
      # fails on a script that announces an absence without printing a
      # population or carrying a runtime control. It runs here so a regression
      # is caught on the PR that introduces it; a detector nobody runs reports
      # nothing and looks identical to a clean one.
      - name: Population and control reporting (advisory)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:population

      # Probes every script entry point with --help under a 10s budget, in a
      # scratch copy of the tree so a script that ignores the flag and mutates
      # cannot touch the source. It grades HANGS only: a non-zero exit is
      # reported, never failed on, because plenty of scripts answer --help with
      # exit 1 or 2. Wired here on 2026-09-02 after an audit round found the
      # script defined, its suite running, and the gate itself invoked by
      # nothing, which is a detector that reports the same as a clean one.
      - name: Entry points return under budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:entrypoints

      # A skill body that MANDATES a tool it does not declare in allowed-tools
      # fails at run time in someone else's session, where nothing here can see
      # it. Mutation-verified before wiring: a planted skill mandating an
      # undeclared tool takes this to exit 1. Its two siblings are deliberately
      # NOT wired: check:triggers grades prose heuristically and says so in its
      # own header, and check:skills runs only a selftest.
      - name: Skill bodies declare the tools they mandate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:skill-tools

      # AGENTS.md's generated half is distilled from the rule-* skills, so a
      # Codex session in this repo sees the conventions it audits against. This
      # regenerates to a temp path and diffs against the committed file: exit 1
      # when a rule changed and AGENTS.md did not. Linux only because the
      # comparison is byte-exact and a CRLF checkout would be a red about line
      # endings, not about drift.
      - name: AGENTS.md matches the rules it is generated from
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:agents-md

      # docs/decisions.md is one shared insertion point, so every PR that records
      # a decision conflicts with every other one that does. `[measured
      # 2026-09-08]` of 13 open PRs, 6 touched it and all 15 pairs among those 6
      # conflicted, on that file. This lints the wreckage a botched resolution
      # leaves: a `## <date>` heading welded into a paragraph (markdown renders it
      # as prose and the entry vanishes), an entry with no body, the same decision
      # twice. Three open PRs carried the identical welded line when it was wired.
      #
      # NOT gated to ubuntu. The comparison is not byte-exact — the subject
      # normalises CRLF before reading — so a Windows checkout cannot produce a
      # red about line endings, and this repo's own merge policy notes that five
      # of the other steps being ubuntu-only is what makes a green board mean less
      # than it looks. It costs milliseconds on a leg that already runs.
      - name: docs/decisions.md carries no welded, empty or duplicated entry
        run: npm run check:decisions

      # CLAUDE.md is the file every session loads before it does anything, and
      # a false claim in it is acted on rather than read. Three went stale
      # inside 48 hours: the gate's step count (a session skipped check:suites
      # and reported an unverified suite green), "force-push is blocked" (two
      # sessions took worse git paths on its authority in one morning), and the
      # `passes` table, which listed four states for as long as five existed.
      #
      # Only mechanically checkable claims are graded, each against one named
      # authority. Prose judgement is out of scope on purpose: a checker that
      # guesses produces false positives, and a gate with false positives gets
      # switched off, at which point it protects nothing.
      #
      # RUNS WITHOUT CREDENTIALS. Exactly one claim needs the GitHub API, and
      # there is no token here, so that claim SKIPs with a printed reason and
      # the run stays green. Unreachable never reads as verified — the skip is
      # in the log. The local gate, where `gh` is authenticated, grades it.
      - name: CLAUDE.md still describes the tree
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:claude-md

      # A FLOOR against coverage regression, not a quality claim. Grades the
      # coverage receipt that `npm test` above published (every suite ran once
      # under NODE_V8_COVERAGE; no dependency, c8 was costed and rejected in
      # docs/evidence-coverage-gate-2026-09-08.md), refuses a missing, stale,
      # partial or red receipt with exit 2, and fails only
      # when the count of plugin functions no suite enters, or of plugin files
      # no suite loads, rises ABOVE what HEAD scored when the floor was measured.
      # Coverage measures execution, not verification: a function entered every
      # run while nothing asserts on it is green here. Linux only, like the steps
      # above: the count is platform-sensitive (Windows-gated code is entered on
      # one runner and not the other) and one measurement is the point.
      - name: Coverage floor (never-entered plugin functions do not grow)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:coverage
