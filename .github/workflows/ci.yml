name: CI

on:
  # ⚠️ branches: [main] IS A COST CONTROL. DO NOT REMOVE IT TO "GET CI ON MY BRANCH".
  #
  # This trigger carried no branch filter, so every push to every branch ran the
  # whole matrix. [measured 2026-09-03, `gh api repos/:owner/:repo/actions/runs`
  # over 24h] 26 push runs / ~324 wall-clock minutes against 8 pull_request runs
  # / ~95 minutes. Pushes were 77% of the spend, and this repo runs many parallel
  # agent worktrees, so the branch tail grows with the fleet rather than the work.
  #
  # Wall-clock UNDERSTATES it: a matrix bills the SUM of its jobs, and
  # windows-latest carries a 2x minute multiplier, so the real billable figure is
  # materially higher than 324.
  #
  # What this does NOT trade away: `main` still gets a verdict on every push, and
  # a feature branch still gets one from its PR — on the merge ref, which is the
  # tree that actually merges and the only tree the verdict is about. With many
  # concurrent sessions `main` moves constantly, so a branch green in isolation
  # can be red on its new base, and only the PR run can see that.
  #
  # The cost of NOT doing this is measured, on a sibling repo: its gate billed
  # 3,283 minutes in a month against a 3,000 ACCOUNT-WIDE allowance and was
  # disabled by hand, leaving that repo with no CI for three weeks. The fix there
  # was this same one line, not dropping PRs.
  #
  # A branch with NO open PR gets no CI. That is the accepted trade: open a draft
  # PR and you have it back, at zero cost until you mark it ready.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped 2026-08-17. It was the single largest GROSS line in the
        # whole account — 376 macOS minutes in 17 days, $23.34 gross — because
        # this matrix runs on every push and pull_request, and 28 pushes landed
        # in one day. Public repos bill $0, so it cost nothing; it was noise in
        # the usage report and it tripled CI wall-clock per push.
        #
        # It also tested nothing the other two do not. This plugin is pure Node
        # with no native deps and no darwin-specific code paths; the platform
        # risk it actually carries is Windows (cmd.exe routing, the PowerShell
        # curl alias, CRLF, reserved device names), which is why windows-latest
        # stays. Re-add macos-latest the day a macOS-only failure appears.
        os: [ubuntu-latest, windows-latest]
    steps:
      # v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v7 is the current major for both and runs natively.
      # This job touches neither action's optional surface — checkout takes no
      # inputs, setup-node takes only node-version (no cache, no registry) — so
      # nothing in the v5/v6/v7 changelogs applies here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite (autodev-memory) is built in from Node 22.
          node-version: '22'
      - name: Run test suites and validator
        run: npm test
      - name: Check every hook parses
        shell: bash
        run: |
          for f in plugins/*/hooks/*.js; do node --check "$f"; done

      # A green suite that executes nothing is this repo's worst historical bug:
      # test-all.js once spawned a bare `node` for every suite and CI passed on
      # an empty run. This stubs each suite's subject and asserts the suite goes
      # red. It rewrites files in place and restores them, so it runs only on
      # Linux — one clean checkout is enough, and three would just triple a
      # 40-second job for the same answer.
      - name: Prove every suite can fail
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:suites

      # A gate as of this commit: the count is 0 and mutation-verified. It
      # fails on a script that announces an absence without printing a
      # population or carrying a runtime control. It runs here so a regression
      # is caught on the PR that introduces it; a detector nobody runs reports
      # nothing and looks identical to a clean one.
      - name: Population and control reporting (advisory)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:population

      # Probes every script entry point with --help under a 10s budget, in a
      # scratch copy of the tree so a script that ignores the flag and mutates
      # cannot touch the source. It grades HANGS only: a non-zero exit is
      # reported, never failed on, because plenty of scripts answer --help with
      # exit 1 or 2. Wired here on 2026-09-02 after an audit round found the
      # script defined, its suite running, and the gate itself invoked by
      # nothing, which is a detector that reports the same as a clean one.
      - name: Entry points return under budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:entrypoints

      # A skill body that MANDATES a tool it does not declare in allowed-tools
      # fails at run time in someone else's session, where nothing here can see
      # it. Mutation-verified before wiring: a planted skill mandating an
      # undeclared tool takes this to exit 1. Its two siblings are deliberately
      # NOT wired: check:triggers grades prose heuristically and says so in its
      # own header, and check:skills runs only a selftest.
      - name: Skill bodies declare the tools they mandate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:skill-tools
